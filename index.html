<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =================================================================
   Emulsion model
   The whisk breaks free oil into droplets at rate D; the yolk's lecithin can
   coat new droplets at rate C, which grows as the emulsion builds. When D > C,
   uncoated droplets merge and stability falls; at ~0 the emulsion breaks.
   ================================================================= */
const YOLK_ML = 17, VIN_ML = 10, TARGET = 180;
const S = {};
function freshState() {
  Object.assign(S, {
    vin: false, yolkTot: YOLK_ML, dome: YOLK_ML, L: 0, vW: 0, E: 0, F: 0, s: 1, d: 0, broken: false,
    poured: 0, whisk: false, pouring: false, everWhisk: false, rate: rateNow(), t: 0,
    flags: {}, rescue: null, spoonIn: null, done: null, jug: { w: 0, o: 0, mayo: 0 }, pooledWarn: 0
  });
}
const lecithin = () => (0.9 + 0.07 * S.E) * Math.min(1, S.L / 0.8);
const waterBody = () => S.vW + (S.yolkTot - S.dome);
function emulsion(dt) {
  // the whisk loosens the yolk dome into the liquid
  if (S.whisk && S.dome > 0) { const dl = Math.min(S.dome, dt * 0.5 * YOLK_ML); S.dome -= dl; S.L = 1 - S.dome / YOLK_ML; }
  if (S.pouring && oilAllowed()) { const q = S.rate * dt; S.F += q; S.poured += q; }
  if (S.spoonIn) {            // a spoonful of broken mix being worked in
    const k = Math.min(1, dt / S.spoonIn.left); const o = S.spoonIn.o * k, w = S.spoonIn.w * k;
    S.F += o; S.vW += w; S.spoonIn.o -= o; S.spoonIn.w -= w; S.spoonIn.left -= dt;
    if (S.spoonIn.left <= 0) S.spoonIn = null;
  }
  if (S.whisk && !S.broken && S.F > 0) {
    const D = Math.min(S.F * 3, 14), C = Math.max(0.05, lecithin());
    const coat = Math.min(S.F, Math.min(D, C) * dt);
    S.E += coat; S.F -= coat;
    const r = D / C;
    if (r > 1) S.s -= Math.min(0.42, 0.5 * (r - 1)) * dt;
    else S.s += 0.3 * (1 - S.s) * (1 - r) * dt;
    S.s = Math.max(0, Math.min(1, S.s));
  } else if (S.whisk && !S.broken) S.s += 0.3 * (1 - S.s) * dt;
  if (!S.broken && S.s < 0.04 && S.E + S.F > 3) {
    S.broken = true; log('分離した — 油を速く入れすぎた', 'bad'); toast('分離しました — 新しい卵黄で救出できます');
  }
  if (S.broken) { const c = S.E * Math.min(1, dt * 1.2); S.E -= c; S.F += c; }
  // droplet size: coarse at first, finer as the emulsion builds; merging makes it coarse again
  let dT;
  if (S.done) dT = S.done.d;
  else if (S.broken) dT = 160 + 60 * S.F / (S.F + waterBody() + 1);
  else if (S.E + S.F < 0.3) dT = 0;
  else dT = 2.4 + 32 * Math.exp(-S.E / 12) + 130 * Math.pow(1 - S.s, 1.6) + (S.whisk ? 0 : 6 * Math.min(1, S.F / 5));
  S.d += (dT - S.d) * (1 - Math.exp(-dt * 2.5));
  // event log
  const f = S.flags;
  if (!f.forming && !S.broken && S.E > 6 && S.d < 15) { f.forming = true; log('乳化が進行中 — 油滴が細かくなっている', 'good'); }
  if (!S.broken && S.s < 0.6 && !f.warn) { f.warn = true; log('注意：油滴が合体し始めた', 'warn'); toast('油滴が合体しています — 注ぐ速さを落として'); }
  if (S.s > 0.9) f.warn = false;
  if (S.pouring && !S.whisk && oilAllowed() && S.t - S.pooledWarn > 4) { S.pooledWarn = S.t; toast('泡立てが止まっています — 油が上にたまるだけです'); }
  if (!S.done && !S.broken && S.E >= TARGET && S.s > 0.6) startDone();
}
const oilAllowed = () => S.vin && !S.broken && !S.rescue && !S.done;

/* =================================================================
   Renderer & scene
   ================================================================= */
const isMobile = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const lin = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
const scene = new THREE.Scene();
scene.background = lin(0.86, 0.81, 0.75);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.5, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 150; controls.maxPolarAngle = 1.5; controls.minPolarAngle = 0.1;
function frameCamera() {
  const a = innerWidth / innerHeight;
  const dist = a < 1 ? 44 / Math.pow(a, 0.75) : 47;
  controls.target.set(a < 1 ? 2 : 5, a < 1 ? 5 : 4, a < 1 ? 1 : 0);
  camera.position.copy(controls.target).addScaledVector(new THREE.Vector3(0.22, 0.52, 0.82).normalize(), dist);
  controls.update();
}
frameCamera();
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x8a7a68, 0.9));
const sun = new THREE.DirectionalLight(0xffe7c8, 2.5);
sun.position.set(26, 62, 30); sun.target.position.set(2, 0, 0); sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -36, near: 15, far: 150 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 4;
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0xfff0e0, 0.5); fillL.position.set(-34, 26, 26); scene.add(fillL);

/* ---------- helpers ---------- */
const V2 = (x, y) => new THREE.Vector2(x, y);
function tex(w, h, draw, o = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (o.srgb !== false) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  if (o.rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.rep[0], o.rep[1]); }
  return t;
}
function put(geo, mat, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (o.p) m.position.set(...o.p); if (o.r) m.rotation.set(...o.r); if (o.s) m.scale.set(...o.s);
  m.castShadow = !!o.cast; m.receiveShadow = !!o.recv; if (o.ro !== undefined) m.renderOrder = o.ro;
  (o.to || scene).add(m); return m;
}
function glassMat(o = {}) {
  const m = new THREE.MeshPhysicalMaterial({ color: o.color ?? 0xffffff, roughness: 0.03, metalness: 0, ior: 1.5, transparent: true,
    opacity: o.op ?? 0.08, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: o.env ?? 1.6 });
  const k = (o.edge ?? 0.45).toFixed(2);
  m.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      `{ float e = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition))); e = e*e*e;
         diffuseColor.a = clamp(diffuseColor.a + e * ${k}, 0.0, 0.88); outgoingLight += vec3(e * 0.05); }
       #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'my' + k;
  return m;
}
const span = (a, b, n) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);
function wallLathe(rIn, ys, t, seg = 56, bottomT = t) {
  const p = [V2(0, ys[0] - bottomT), V2(rIn(ys[0]) + t * 0.8, ys[0] - bottomT)];
  for (const y of ys) p.push(V2(rIn(y) + t, y));
  const top = ys[ys.length - 1], rt = rIn(top);
  p.push(V2(rt + t * 0.8, top + t * 0.45), V2(rt + t * 0.3, top + t * 0.6), V2(rt, top + t * 0.15));
  for (let i = ys.length - 1; i >= 0; i--) p.push(V2(rIn(ys[i]), ys[i]));
  p.push(V2(0, ys[0]));
  return new THREE.LatheGeometry(p, seg);
}
function label(text, sub, band, w = 512, h = 220) {
  return tex(w, h, (g) => {
    g.fillStyle = '#fbf7ee'; g.fillRect(0, 0, w, h); g.fillStyle = band; g.fillRect(0, 0, w, 30); g.fillRect(0, h - 14, w, 14);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#2a1e12'; g.font = `800 ${text.length > 6 ? 70 : 84}px "Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif`; g.fillText(text, w / 2, 102);
    g.fillStyle = '#6a5640'; g.font = '600 26px "Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif'; g.fillText(sub, w / 2, 168);
  });
}

/* =================================================================
   Bench (matte wood), backsplash
   ================================================================= */
{
  const wood = tex(1024, 512, (g, w, h) => {
    g.fillStyle = '#b08a62'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 6; i++) { g.fillStyle = `rgba(${90 + i * 6},${62 + i * 4},${38},0.16)`; g.fillRect(0, i * h / 6, w, 2); }
    for (let k = 0; k < 900; k++) {
      const y = Math.random() * h, len = 80 + Math.random() * 400, x = Math.random() * w;
      g.strokeStyle = `rgba(${70 + Math.random() * 40},${45 + Math.random() * 25},${25},${0.05 + Math.random() * 0.08})`; g.lineWidth = 1 + Math.random() * 1.5;
      g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + len * 0.3, y + 3, x + len * 0.6, y - 3, x + len, y + 1); g.stroke();
    }
  }, { rep: [2, 1.4] });
  put(new THREE.BoxGeometry(140, 4, 64), new THREE.MeshStandardMaterial({ map: wood, roughness: 0.88, envMapIntensity: 0.4 }), { p: [2, -2, -4], recv: true });
  const tile = tex(512, 512, (g, w, h) => {
    g.fillStyle = '#c9bfb0'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 8; i++) for (let j = 0; j < 4; j++) { const v = 236 + ((i * 3 + j * 7) % 9); g.fillStyle = `rgb(${v},${v - 6},${v - 14})`; g.fillRect(i * 64 + 2, j * 128 + 2 + (i % 2) * 0, 60, 124); }
  }, { rep: [16, 5] });
  put(new THREE.PlaneGeometry(140, 70), new THREE.MeshStandardMaterial({ map: tile, roughness: 0.4, envMapIntensity: 0.6 }), { p: [2, 35, -36], recv: true });
}

/* =================================================================
   Folded gingham cloth + glass mixing bowl
   ================================================================= */
{
  const ging = tex(256, 256, (g, w, h) => {
    g.fillStyle = '#f6efe4'; g.fillRect(0, 0, w, h);
    const n = 8, s = w / n;

  if (on && S.rescue) { toast('先に分離した液を混ぜ戻してください'); return; }

  S.pouring = on; $('bOil').classList.toggle('pouring', on);
}
function rescue() {
  if (!S.broken || S.rescue) return;
  setPour(false);
  // set the broken mix aside in the jug, start again with a fresh yolk in a clean bowl
  const w = waterBody(), o = S.F + S.E;
  S.rescue = { phase: 'aside', t: 0, w0: w, o0: o };
  S.jug.w = 0; S.jug.o = 0;
  log('分離した液を計量カップに移し、きれいなボウルに新しい卵黄を入れた');
}
function stepRescue(dt) {
  const R = S.rescue; if (!R) return;
  R.t += dt;
  if (R.phase === 'aside') {
    const k = Math.min(1, R.t / 1.4);
    S.jug.w = R.w0 * k; S.jug.o = R.o0 * k;
    S.vW = Math.max(0, R.w0 * (1 - k) - (S.yolkTot - S.dome)); S.F = R.o0 * (1 - k); S.E = 0;
    if (k >= 1) {
      S.vW = 0; S.yolkTot = YOLK_ML; S.dome = YOLK_ML; S.L = 0; S.E = 0; S.F = 0; S.s = 1; S.d = 0; S.broken = false;
      yolk.visible = true; S.flags.forming = false; R.phase = 'spoon'; R.t = 0; R.hinted = false;
    }
  } else if (R.phase === 'spoon') {
    const left = S.jug.w + S.jug.o;
    if (left < 0.05 && !S.spoonIn && !ANIM.spoon) {
      S.rescue = null; S.jug.w = S.jug.o = 0;
      log('新しい卵黄で救出した', 'good'); toast('救出成功 — 油をゆっくり加え続けて');
      return;
    }
    if (!S.whisk) { if (!R.hinted && R.t > 1) { R.hinted = true; toast('泡立てを始めると分離した液を混ぜ戻せます'); } return; }
    if (!ANIM.spoon && !S.spoonIn && S.L > 0.8 && S.F < 0.4 && S.s > 0.85 && left > 0.05) {
      const amt = Math.min(2.5 + 0.2 * S.E, 20, left), fo = S.jug.o / left;
      S.jug.o -= amt * fo; S.jug.w -= amt * (1 - fo);
      ANIM.spoon = { t: 0, dur: 1.7, from: new THREE.Vector3(JUG.x, 0.3 + left / JUG_AREA + 0.4, JUG.z), to: new THREE.Vector3(1.5, BY + levels.hb + 2.0, 1.2),
        loadMat: oilMat, dropped: false, onDrop: () => { S.spoonIn = { o: amt * fo, w: amt * (1 - fo), left: 3 }; } };
    }
  }
}
function startDone() {
  S.done = { t: 0, trips: 0, total: waterBody() + S.E + S.F, E: S.E, d: S.d };
  setPour(false);
  log(`マヨネーズ完成：油 ${Math.round(S.E)} mL が乳化した`, 'good');
  updateSteps();
}
function stepDone(dt) {
  const D = S.done; if (!D) return;
  D.t += dt;
  if (D.t > 1.2 && S.whisk) toggleWhisk(false);
  if (D.t > 2 && !ANIM.spoon && D.trips < 6) {
    D.trips++;
    const amt = D.total * (D.trips < 6 ? 0.17 : 0.135);
    ANIM.spoon = { t: 0, dur: 1.3, from: new THREE.Vector3(1.2, BY + Math.max(0.6, levels.hb), 1.0), to: new THREE.Vector3(JUG.x, 0.3 + (S.jug.mayo / JUG_AREA) + 1.5, JUG.z), loadMat: bodyMat, dropped: false,
      onDrop: () => {
        const tot = waterBody() + S.E + S.F, k = Math.min(1, amt / Math.max(1e-6, tot));
        S.vW *= 1 - k; S.yolkTot -= (S.yolkTot - S.dome) * k; S.E *= 1 - k; S.F *= 1 - k; S.jug.mayo += amt;
        if (D.trips === 6) { toast(`計量カップにマヨネーズ約 ${Math.round(S.jug.mayo / 10) * 10} mL`); log(`計量カップに移した：マヨネーズ約 ${Math.round(S.jug.mayo / 10) * 10} mL`); }
      } };
  }
}
function resetAll() {
  freshState(); yolk.visible = true; S.d = 0;
  ANIM.vin = null; ANIM.spoon = null; spoon.visible = false; ANIM.oil = 0; ANIM.whisk = 0;
  setBottleFill(vinB, 0.7); vinB.position.copy(VIN_REST.p); vinB.quaternion.copy(VIN_REST.q);
  toggleWhisk(false); setPour(false); logEl.innerHTML = ''; bodyBuilt = oilBuilt = -1;
  log('ボウルに卵黄1個'); updateSteps();
}

/* =================================================================
   Contents rendering
   ================================================================= */
const C_VIN = lin(0.96, 0.93, 0.82), C_YOLK = lin(0.98, 0.47, 0.03), C_CREAM_A = lin(1.0, 0.74, 0.26), C_CREAM_B = lin(0.97, 0.84, 0.52), C_BROKEN = lin(0.86, 0.46, 0.12);
const C_OIL = lin(0.96, 0.74, 0.18), C_OIL_SEP = lin(1.0, 0.84, 0.25);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const cTmp = new THREE.Color(), cTmp2 = new THREE.Color();
let peakPhase = 0;
const bm4 = new THREE.Matrix4(), bq = new THREE.Quaternion(), bsv = new THREE.Vector3(), bpv = new THREE.Vector3();
function renderContents(dt) {
  const wB = waterBody(), vb = wB + S.E, vo = S.F;
  const hb = bLevel(vb), ho = bLevel(vb + vo);
  levels.hb = hb; levels.ho = Math.max(ho, S.dome > 0 ? 1.4 * Math.cbrt(S.dome / YOLK_ML) * 0.62 * 2.3 / 1.4 : 0);
  // yolk dome
  yolk.visible = S.dome > 0.05;
  if (yolk.visible) { const k = Math.cbrt(S.dome / YOLK_ML); yolk.scale.set(k * (1 + 0.15 * S.L), 0.62 * k * (1 - 0.35 * S.L), k * (1 + 0.15 * S.L)); }
  // body
  body.visible = surface.visible = vb > 0.2;
  if (body.visible && Math.abs(hb - bodyBuilt) > 0.008) { body.geometry.dispose(); body.geometry = sideLathe(0, hb, true); bodyBuilt = hb; }
  const e = vb > 0 ? S.E / vb : 0;
  const yolkIn = S.yolkTot - S.dome, yf = wB > 0 ? yolkIn / wB : 0;
  cTmp.copy(C_VIN).lerp(C_YOLK, Math.min(1, yf * 1.15));
  cTmp2.copy(C_CREAM_A).lerp(C_CREAM_B, smooth(0.55, 0.86, e));
  cTmp.lerp(cTmp2, smooth(0.03, 0.55, e));
  const T = S.broken ? 0 : smooth(0.45, 0.82, e) * smooth(0.35, 0.85, S.s);
  if (S.broken) cTmp.copy(C_BROKEN);
  bodyMat.color.copy(cTmp);
  bodyMat.opacity = S.broken ? 0.9 : 0.5 + 0.5 * smooth(0.05, 0.45, e) + 0.15 * yf;
  bodyMat.roughness = 0.1 + 0.5 * T; bodyMat.clearcoat = 0.7 * (1 - T);
  // surface: runny ripples, whisk vortex and trails; thick mixtures keep soft peaks
  if (surface.visible) {
    if (S.whisk && ANIM.whisk >= 1) peakPhase += dt * 1.4;
    const R = bR(hb) - 0.03, t = S.t;
    const wx = whisk.position.x, wz = whisk.position.z, whOn = ANIM.whisk >= 1 ? 1 : 0;
    let pi = 0, vi = 0;
    for (let i = 0; i <= SR; i++) {
      const rho = i / SR, mask = 1 - Math.pow(rho, 6), d = rho * R;
      for (let j = 0; j <= SS; j++) {
        const th = j / SS * Math.PI * 2, x = Math.cos(th) * d, z = Math.sin(th) * d;
        const runny = (1 - T) * (0.012 + 0.05 * whOn) * Math.sin(6 * th - 5 * t + 9 * rho) * rho;
        const dw = (x - wx) ** 2 + (z - wz) ** 2;
        const dip = -whOn * (0.18 * (1 - T) + 0.35 * T) * Math.exp(-dw / 2.2);
        const n = Math.sin(x * 1.3 + peakPhase) * Math.cos(z * 1.1 - peakPhase * 0.7) + 0.6 * Math.sin(x * 2.7 - z * 2.1 + peakPhase * 1.3) + 0.4 * Math.cos(x * 3.9 + z * 3.3 - peakPhase);
        const pk = T * (1.0 * Math.pow(Math.max(0, n / 2), 1.5) - 0.12 + 0.1 * n);
        sPos[pi++] = x; sPos[pi++] = hb + mask * (runny + dip + pk) + 0.002; sPos[pi++] = z; vi++;
      }
    }
    surfGeo.attributes.position.needsUpdate = true; surfGeo.computeVertexNormals();
  }
  // oil layer
  const showOil = vo > 0.15;
  oilSide.visible = oilTop.visible = showOil;
  if (showOil) {
    if (Math.abs(ho - oilBuilt) > 0.008) { oilSide.geometry.dispose(); oilSide.geometry = sideLathe(hb, ho, false); oilBuilt = ho; }
    const r = bR(ho) - 0.03; oilTop.scale.set(r, 1, r); oilTop.position.y = BY + ho + 0.01 + 0.01 * Math.sin(S.t * 3);
    oilMat.opacity = S.broken ? 0.2 + 0.1 * Math.min(1, vo / 60) : 0.38 + 0.22 * Math.min(1, vo / 40);
    oilMat.color.copy(S.broken ? C_OIL_SEP : C_OIL);
  }
  // beads: merging oil droplets on the surface / curdled specks when broken
  const nb = S.broken ? NB : Math.round(NB * smooth(0.25, 0.95, 1 - S.s) * (S.E + S.F > 2 ? 1 : 0));
  const Rb = bR(hb) - 0.3;
  let c = 0;
  for (let i = 0; i < nb; i++) {
    const b = beadSeed[i];
    const a = b.a + S.t * 0.25 * b.w * (S.whisk ? 3 : 0.3);
    const rr = b.r * Rb;
    const size = S.broken ? 0.12 + 0.18 * b.k : (0.07 + 0.32 * b.k) * Math.min(1, S.d / 80);
    const y = S.broken ? hb - 0.05 - b.k * Math.max(0.05, hb * 0.5) : hb + 0.03;
    bpv.set(Math.cos(a) * rr, BY + y, Math.sin(a) * rr); bsv.set(size, size * (S.broken ? 0.7 : 0.45), size);
    bm4.compose(bpv, bq, bsv); beads.setMatrixAt(c, bm4);
    beads.setColorAt(c, S.broken ? cTmp2.setRGB(1, 0.9, 0.6) : cTmp2.copy(lin(1, 0.88, 0.45)));
    c++;
  }
  beads.count = c; beads.instanceMatrix.needsUpdate = true; if (beads.instanceColor) beads.instanceColor.needsUpdate = true;
  // jug contents
  const jw = S.jug.w, jo = S.jug.o, jm = S.jug.mayo;
  jugBody.visible = jw + jm > 0.2; jugOil.visible = jo > 0.2;
  if (jugBody.visible) {
    const h = (jw + jm) / JUG_AREA; jugBody.scale.y = h; jugBody.position.set(JUG.x, 0.3 + h / 2, JUG.z);
    if (jm > 0) { jugMat.color.copy(C_CREAM_B); jugMat.roughness = 0.6; jugMat.opacity = 1; } else { jugMat.color.copy(C_BROKEN); jugMat.roughness = 0.2; jugMat.opacity = 0.75; }
  }
  if (jugOil.visible) { const h0 = (jw + jm) / JUG_AREA, h = jo / JUG_AREA; jugOil.scale.y = h; jugOil.position.set(JUG.x, 0.3 + h0 + h / 2, JUG.z); }
}

/* =================================================================
   HUD
   ================================================================= */
const $ = (id) => document.getElementById(id);
const micro = $('micro'), mg = micro.getContext('2d');
function sizeMicro() { const r = micro.getBoundingClientRect(), d = Math.min(devicePixelRatio, 2); micro.width = Math.round(r.width * d); micro.height = Math.round(r.height * d); mg.setTransform(d, 0, 0, d, 0, 0); }
const microSeed = Array.from({ length: 220 }, () => [Math.random(), Math.random(), Math.random()]);
function drawMicro() {
  const d = Math.min(devicePixelRatio, 2), W = micro.width / d, H = micro.height / d, cx = W / 2, cy = H / 2, R = W / 2;
  mg.save(); mg.clearRect(0, 0, W, H); mg.beginPath(); mg.arc(cx, cy, R, 0, 6.283); mg.clip();
  mg.fillStyle = S.broken ? '#e9c88a' : '#f3e3bd'; mg.fillRect(0, 0, W, H);
  if (S.d > 0.5) {
    const px = Math.min(R * 0.9, 0.9 + S.d * 0.11 * (W / 58));
    const n = S.broken ? 6 : Math.min(220, Math.round(26 * (W / 58) ** 2 / Math.max(0.5, (px / 2.2) ** 1.4)));
    for (let i = 0; i < n; i++) {
      const [a, b, c] = microSeed[i];
      const x = a * W, y = b * H, r = px * (0.6 + 0.6 * c);
      mg.beginPath(); mg.arc(x, y, r, 0, 6.283);
      mg.fillStyle = 'rgba(255,236,170,.9)'; mg.fill(); mg.lineWidth = 0.8; mg.strokeStyle = 'rgba(140,100,40,.55)'; mg.stroke();
    }
  }
  mg.restore();
}
function updateSteps() {
  const done = [true, S.vin, S.everWhisk && S.L > 0.8, !!S.done, !!S.done];
  let cur = done.indexOf(false); if (cur < 0) cur = 4;
  [...$('steps').children].forEach((li, i) => { li.classList.toggle('done', done[i] && !(S.done && i === 4)); li.classList.toggle('cur', i === cur); });
}
function updateHud() {
  $('oilA').innerHTML = `${S.poured.toFixed(0)}<small>mL</small>`;
  $('oilE').innerHTML = `${(S.done ? S.done.E : S.E).toFixed(0)}<small>/ ${TARGET} mL</small>`;
  const st = $('state');
  let label, cls = '';
  if (S.done) { label = 'マヨネーズ完成'; cls = 'good'; }
  else if (S.broken) { label = '分離'; cls = 'bad'; }
  else if (S.rescue) { label = '救出中'; cls = 'warn'; }
  else if (S.s < 0.6 && S.E + S.F > 1) { label = '油滴が合体中'; cls = 'warn'; }
  else if (S.E > 2) { label = S.E > 60 ? '安定した乳化' : '乳化中'; cls = 'good'; }
  else if (!S.vin) label = '卵黄の準備OK';
  else label = S.whisk ? '泡立て中' : '泡立て待ち';
  st.textContent = label; st.className = cls;
  if (S.d < 0.5) { $('dsz').textContent = '—'; $('dnote').textContent = 'まだ油なし'; }
  else {
    $('dsz').textContent = S.broken ? '> 100 µm' : `${S.d < 10 ? S.d.toFixed(1) : S.d.toFixed(0)} µm`;
    $('dnote').textContent = S.broken ? '油と液体に分離' : S.d < 6 ? '細かい · 安定' : S.d < 20 ? '細かくなっている' : '粗い · 合体中';
  }
  const sp = S.broken ? 0 : S.s * 100;
  $('stab').textContent = `${sp.toFixed(0)}%`; $('stabBar').style.width = `${sp}%`;
  $('bRes').disabled = !S.broken || !!S.rescue; $('bVin').disabled = S.vin; $('bOil').disabled = !oilAllowed();
  drawMicro(); updateSteps();
}
const logEl = $('log');
function log(t, cls = '') { const li = document.createElement('li'); li.textContent = t; if (cls) li.className = cls; logEl.prepend(li); while (logEl.children.length > 7) logEl.lastChild.remove(); }
let tt; function toast(s) { const e = $('toast'); e.textContent = s; e.style.opacity = 1; clearTimeout(tt); tt = setTimeout(() => e.style.opacity = 0, 1800); }

/* =================================================================
   Controls
   ================================================================= */
const rateEl = $('rate');
function rateNow() { return 0.25 * Math.pow(48, +rateEl.value); }
const readRate = () => { const r = rateNow(); if (S) S.rate = r; $('rv').textContent = `${r < 1 ? r.toFixed(2) : r.toFixed(1)} mL/s · ${r < 0.9 ? '細く垂らす' : r < 3 ? '細い流れ' : '速く注ぐ'}`; };
rateEl.addEventListener('input', readRate);
$('bVin').addEventListener('click', addVinegar);
$('bWhisk').addEventListener('click', () => toggleWhisk());
const bOil = $('bOil');
bOil.addEventListener('pointerdown', (e) => { e.preventDefault(); bOil.setPointerCapture?.(e.pointerId); setPour(true); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) bOil.addEventListener(ev, () => setPour(false));
bOil.addEventListener('contextmenu', (e) => e.preventDefault());
$('bRes').addEventListener('click', rescue);
$('bReset').addEventListener('click', resetAll);
function onResize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); sizeMicro(); }
addEventListener('resize', onResize);

/* =================================================================
   Loop
   ================================================================= */
freshState(); readRate(); resetAll(); onResize();
const clock = new THREE.Clock();
let hudT = 0;
function sim(dt) {
  S.t += dt;
  emulsion(dt); stepRescue(dt); stepDone(dt);
  stepProps(dt); renderContents(dt);
}
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  sim(dt);
  controls.update();
  hudT += dt; if (hudT > 0.1) { hudT = 0; updateHud(); }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

// hook for automated checks; has no effect on normal use
window.__mayo = {
  S, addVinegar, toggleWhisk, setPour, rescue, resetAll,
  setRate(v) { rateEl.value = v; readRate(); },
  step(sec, h = 1 / 60) { for (let t = 0; t < sec; t += h) sim(h); updateHud(); renderer.render(scene, camera); },
  until(fn, max = 400, h = 1 / 30) { let t = 0; while (!fn() && t < max) { sim(h); t += h; } updateHud(); renderer.render(scene, camera); return t; },
  hold(on) { renderer.setAnimationLoop(on ? null : frame); if (on) { controls.update(); updateHud(); renderer.render(scene, camera); } },
  view(t, p) { controls.target.set(...t); camera.position.set(...p); controls.update(); },
  log: () => [...logEl.children].map(l => l.textContent)
};
</script>
</body>
</html>
